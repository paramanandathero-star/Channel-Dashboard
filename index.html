<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Channel Pulse</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#14151a;--mute:#6b7280;--line:#e8eaf0;--acc:#5b5bf0;--acc2:#e9e9ff;--ok:#12a36b;--okbg:#dcf7ec;--bad:#e5484d;--badbg:#fde6e7;--warn:#d98a00;--warnbg:#fff1d6;--na:#eef0f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f14;--card:#171923;--ink:#eef0f6;--mute:#9aa1b2;--line:#252838;--acc:#8b8bff;--acc2:#23244a;--ok:#3ddc97;--okbg:#10332a;--bad:#ff7a80;--badbg:#3a1a1d;--warn:#ffc04d;--warnbg:#3a2c0e;--na:#222536;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f14;--card:#171923;--ink:#eef0f6;--mute:#9aa1b2;--line:#252838;--acc:#8b8bff;--acc2:#23244a;--ok:#3ddc97;--okbg:#10332a;--bad:#ff7a80;--badbg:#3a1a1d;--warn:#ffc04d;--warnbg:#3a2c0e;--na:#222536;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 48px}
header{margin-bottom:18px}h1{font-size:22px;margin:0;letter-spacing:-.02em}.sub{color:var(--mute);font-size:13px}
button{font:inherit;cursor:pointer;border:0;background:none;color:var(--mute);padding:7px 14px;border-radius:9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.k{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.d{font-size:12px;margin-top:2px;color:var(--mute)}.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;grid-template-columns:350px 1fr;gap:14px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:4px 11px;border-radius:99px;font-size:12px}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.list{max-height:600px;overflow:auto;margin:0 -6px;padding:0 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;cursor:pointer}.row:hover{background:var(--bg)}.row.sel{background:var(--acc2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--na)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm span{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.r{text-align:right}.num{font-weight:700;font-variant-numeric:tabular-nums;display:block}.g{font-size:12px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--na);color:var(--mute)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}.stats div{background:var(--bg);border-radius:12px;padding:10px 12px}.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mute)}
h2{font-size:16px;margin:0}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
svg text{fill:var(--mute);font-size:11px;font-family:inherit}.ln{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.ar{fill:var(--acc);opacity:.12}.pt{fill:var(--card);stroke:var(--acc);stroke-width:1.6}.gl{stroke:var(--line);stroke-width:1}.sp{fill:none;stroke:var(--acc);stroke-width:1.5}
.stack{display:grid;gap:14px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:8px;font-size:12px;display:none;z-index:9;white-space:nowrap}
.foot{margin-top:18px;color:var(--mute);font-size:12px}
</style>
</head>

function init(){T=D.dates.map(d=>new Date(d+"T00:00:00").getTime());N=T.length;L=N-1;build()}
const fd=(t,y)=>new Date(t).toLocaleDateString("en-US",y?{month:"short",day:"numeric",year:"numeric"}:{month:"short",day:"numeric"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=n=>n==null?"–":n.toLocaleString("en-US");
function build(){chs=D.ch.map(([name,resp,s])=>{const v=s.split(" ").map(x=>x=="."?null:+x);let mx=0;
 v.forEach((x,i)=>{if(x==null)return;if(x===0&&mx>0)v[i]=null;else mx=Math.max(mx,x)});
 let last=null;const f=v.map(x=>{if(x!=null)last=x;return last});
 const pts=[];v.forEach((x,i)=>{if(x!=null)pts.push(i)});
 const ci=pts[pts.length-1],pi=pts[pts.length-2],p2=pts[pts.length-3],p4=pts[pts.length-5];
 const stale=ci<L,cur=v[ci],prev=pi!=null?v[pi]:null;
 const gain=!stale&&prev!=null?cur-prev:null,lastGain=pi!=null&&p2!=null?prev-v[p2]:null;
 let up=-1;for(let k=pts.length-1;k>0;k--){if(v[pts[k]]>v[pts[k-1]]){up=pts[k];break}}
 const st=stale||gain==null?"na":gain>0?"ok":gain==0?"bad":"warn";
 return{name,resp,v,f,pts,cur,prev,gain,lastGain,four:p4!=null&&!stale?cur-v[p4]:null,start:cur-v[pts[0]],first:pts[0],up,st,stale,ci}})}
const lab={ok:"Uploaded",bad:"No new upload",warn:"Videos removed",na:"No data"};
let sel=0,filter="all",sortG=false;
function nice(lo,hi){const r=Math.max(hi-lo,4),s=Math.pow(10,Math.floor(Math.log10(r/4))),m=[1,2,2.5,5,10].find(k=>r/4<=k*s)*s;return[Math.floor(lo/m)*m,Math.ceil(hi/m)*m,m]}
let reg=[];

 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const[x0,x1]=[Math.min(...xs),Math.max(...xs)];

 const X=x=>l+(x1==x0?0:(x-x0)/(x1-x0))*(W-l-r),Y=y=>t+(1-(y-lo)/(hi-lo||1))*(H-t-b);

 const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
 const ticks=[0,.25,.5,.75,1].map(k=>x0+(x1-x0)*k);
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" data-c="${id}">${g}<path class="ar" d="${d}L${X(x1)},${Y(lo)}L${X(x0)},${Y(lo)}Z"/><path class="ln" d="${d}"/>`+
 (pts.length<=60?pts.map(p=>`<circle class="pt" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.6"/>`).join(""):"")+
 ticks.map((x,i)=>`<text x="${X(x)}" y="${H-6}" text-anchor="${i==0?"start":i==4?"end":"middle"}">${fd(x)}</text>`).join("")+`<g class="hv" style="display:none"><line class="gl" y1="${t}" y2="${H-b}" stroke="var(--acc)"/><circle r="4.5" fill="var(--acc)"/></g><rect x="0" y="0" width="${W}" height="${H}" fill="transparent" data-geom="${l},${r},${t},${b},${x0},${x1},${lo},${hi}"/></svg>`}

 <div class="foot">${mode=="Live"?"Loaded live from your Google Sheet each time this page opens.":"Snapshot of the Google Sheet through "+fd(T[L],1)+". Could not load the sheet, so showing saved data. Reason: "+why} Counts are running totals of videos on each channel. A 0 after earlier real counts (Gujarati, from 9 Sep) is treated as missing data.${panel()}</div>`;
 document.scrollingElement.scrollTop=keep}
document.addEventListener("click",e=>{const t=e.target.closest("[data-f],.row[data-i],#sg,#pm,#pl");if(!t)return;
 if(t.id=="pm"){popen=!popen}else if(t.id=="pl"){try{const tx=document.getElementById("pt").value;const p=parseSheet(csv(tx));if(!p.ch.length||p.dates.length<2)throw"no channel data found";D=p;mode="Pasted";sel=0;try{localStorage.setItem("cp.paste",tx)}catch(e){}init()}catch(e){alert("Could not read that data: "+(e&&e.message||e));return}}else if(t.dataset.f)filter=t.dataset.f;else if(t.id=="sg")sortG=!sortG;else sel=+t.dataset.i;render()});
const tip=document.getElementById("tip");

 const svg=rc.ownerSVGElement,[l,r,t,b,x0,x1,lo,hi]=rc.dataset.geom.split(",").map(Number),pts=reg[+svg.dataset.c],bb=svg.getBoundingClientRect(),s=bb.width/640;
 const gx=(e.clientX-bb.left)/s,X=p=>l+(x1==x0?0:(p[0]-x0)/(x1-x0))*(640-l-r);
 let best=pts[0];pts.forEach(p=>{if(Math.abs(X(p)-gx)<Math.abs(X(best)-gx))best=p});
 const y=t+(1-(best[1]-lo)/(hi-lo||1))*(230-t-b),h=svg.querySelector(".hv");h.style.display="";
 h.querySelector("line").setAttribute("x1",X(best));h.querySelector("line").setAttribute("x2",X(best));h.querySelector("circle").setAttribute("cx",X(best));h.querySelector("circle").setAttribute("cy",y);
 tip.style.display="block";tip.textContent=fd(best[0],1)+" · "+best[1].toLocaleString("en-US")+" videos";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY-34)+"px"});
function csv(t){const R=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"){r.push(f);R.push(r);r=[];f=""}else if(c!="\r")f+=c}
 if(f||r.length){r.push(f);R.push(r)}return R}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function pdate(x){x=(x||"").trim();if(!x)return null;let m;
 if(m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(x))return[+m[1],+m[2],+m[3]];

 if(m=/^(\d{1,2})[\/.\-](\d{1,2})$/.exec(x))return[null,+m[2],+m[1]];
 let a=/^(\d{1,2})\s+([A-Za-z]{3})/.exec(x);if(a&&MON[a[2].toLowerCase()]){const y=/(\d{4})/.exec(x);return[y?+y[1]:null,MON[a[2].toLowerCase()],+a[1]]}
 a=/^([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})\b/.exec(x);if(a&&MON[a[1].toLowerCase()]){const y=/(\d{4})/.exec(x);return[y?+y[1]:null,MON[a[1].toLowerCase()],+a[2]]}
 return null}
function fixYears(ds){let k=0,pm=0;ds.forEach(d=>{if(d[0]==null){if(d[1]<pm)k++;pm=d[1]}});let y=new Date().getFullYear()-k;pm=0;
 return ds.map(d=>{if(d[0]!=null){y=d[0];pm=d[1];return d}if(d[1]<pm)y++;pm=d[1];return[y,d[1],d[2]]})}
const iso=d=>`${d[0]}-${String(d[1]).padStart(2,"0")}-${String(d[2]).padStart(2,"0")}`;
const isText=x=>x&&!/^[\d.,\s]+$/.test(x)&&!/^n\/a$/i.test(x)&&!pdate(x);
const val=x=>{x=(x||"").trim().replace(/,/g,"");return x===""||/n\/a/i.test(x)||isNaN(+x)?".":x};
function parseSheet(rows){rows=rows.map(r=>r.map(x=>(x||"").trim()));let out;
 const hi=rows.findIndex(r=>r.filter(x=>pdate(x)).length>3);
 if(hi>=0){const dc=[];rows[hi].forEach((x,i)=>{if(pdate(x))dc.push(i)});const ds=fixYears(dc.map(i=>pdate(rows[hi][i])));
  const body=rows.slice(hi+1),first=dc[0];let nc=-1,rc=-1;
  for(let c=0;c<first;c++){if(body.filter(r=>isText(r[c])).length>=3){if(nc<0)nc=c;else if(rc<0){rc=c}}}
  if(nc<0)throw"no channel name column found";
  const ch=body.filter(r=>isText(r[nc])&&dc.some(i=>val(r[i])!=".")).map(r=>[r[nc],rc>=0?r[rc]:"",dc.map(i=>val(r[i]))]);
  out={dates:ds.map(iso),ch}}
 else{let c=-1;for(let k=0;k<Math.min(4,(rows[0]||[]).length);k++){if(rows.filter(r=>pdate(r[k])).length>3){c=k;break}}
  if(c<0)throw"could not find a row or column of dates";
  const di=[];rows.forEach((r,i)=>{if(pdate(r[c]))di.push(i)});const hr=rows[di[0]-1]||[];
  const cols=[];hr.forEach((x,j)=>{if(j!=c&&isText(x)&&!/^total/i.test(x))cols.push(j)});
  if(!cols.length)throw"no channel names found above the dates";
  const ds=fixYears(di.map(i=>pdate(rows[i][c])));
  out={dates:ds.map(iso),ch:cols.map(j=>[hr[j],"",di.map(i=>val(rows[i][j]))])}}
 const ord=out.dates.map((d,i)=>i).sort((a,b)=>out.dates[a]<out.dates[b]?-1:out.dates[a]>out.dates[b]?1:0);
 return{dates:ord.map(i=>out.dates[i]),ch:out.ch.map(([n,r,v])=>[n,r,ord.map(i=>v[i]).join(" ")])}}
async function live(){try{let txt,errs=[];for(const u of LIVE){try{const res=await fetch(u);if(res.ok){txt=await res.text();break}errs.push("HTTP "+res.status)}catch(e){errs.push(e.message||"blocked")}}
 if(!txt)throw"could not download ("+errs.join(", ")+")";
 const rows=csv(txt);let p;try{p=parseSheet(rows)}catch(e){throw e+". First rows: "+rows.slice(0,3).map(r=>r.slice(0,6).join(" | ")).join(" // ")}
 if(!p.ch.length||p.dates.length<2)throw"no channel data found";
 D=p;mode="Live";why="";sel=0;init();render()}catch(e){why=String(e&&e.message||e);render()}}
function panel(){if(mode=="Live")return"";return`<div style="margin-top:12px"><button class="chip on" id="pm">${popen?"Hide":"Paste sheet data manually"}</button></div>`+(popen?`<div class="card" style="margin-top:10px"><div class="sub" style="margin-bottom:8px">Open your published CSV link in the browser, select all (Ctrl/Cmd+A), copy, and paste it here. It is remembered on this device.</div><textarea id="pt" rows="6" style="width:100%;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea><div style="margin-top:8px"><button class="chip on" id="pl">Load this data</button></div></div>`:"")}
try{const tx=localStorage.getItem("cp.paste");if(tx){const p=parseSheet(csv(tx));if(p.ch.length&&p.dates.length>1){D=p;mode="Pasted"}}}catch(e){}
init();render();live();
</script>
